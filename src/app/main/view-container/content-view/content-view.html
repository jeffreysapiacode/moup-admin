<div class="position-relative h-100">
  <div class="container-fluid no-gutters">
    <div class="row no-gutters">
      <div class="col no-gutters pt-4 ps-4">
        <span class="content-view-title-text">Select an episode</span>
      </div>
    </div>
    <div class="row no-gutters pt-2">
      <div class="col no-gutters">
        @for (content of this.contentList; track content.uuid) {
          <div class="content-view-content-container mx-3 mb-2 mt-2 d-flex align-items-center">
            <div class="row no-gutters w-100">
              <div class="col no-gutters d-flex align-items-center ps-3">
                <span class="content-view-content-title">{{content.title}}</span>
              </div>
              <div class="col no-gutters d-flex justify-content-center align-items-center">
                <span class="content-view-content-detail ps-3">{{formatTime(content.duration)}}</span>
              </div>
              <div class="col no-gutters d-flex justify-content-center align-items-center">
                <span class="content-view-content-detail ps-3">{{formatDate(content.uploadedOn)}}</span>
              </div>
              <div class="col-auto no-gutters pe-3 d-flex justify-content-end align-items-center">
                <svg width="35" height="35" viewBox="0 0 35 35" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M19.2098 17.5001L11.9911 10.2813L14.0532 8.21924L23.334 17.5001L14.0532 26.7809L11.9911 24.7188L19.2098 17.5001Z" fill="#918B68"/>
                </svg>
              </div>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
  <!-- Upload Button -->
  <div (click)="createContentOpen = true" class="content-view-button-upload-container m-3 d-flex justify-content-center align-items-center">
    <svg class="content-view-button-upload-svg" width="54" height="54" viewBox="0 0 54 54" fill="none"
         xmlns="http://www.w3.org/2000/svg">
      <path d="M42.75 29.25H29.25V42.75H24.75V29.25H11.25V24.75H24.75V11.25H29.25V24.75H42.75V29.25Z" fill="#8E8B67" />
    </svg>
  </div>
  <!-- Upload Card Container -->
  <div [ngClass]="{'content-view-upload-container-open': createContentOpen}" class="content-view-upload-container h-100 w-100">
    <app-upload (createContentOpen)="createContentOpen = false"></app-upload>
  </div>
</div>
