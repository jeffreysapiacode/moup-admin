<div class="container-fluid no-gutters h-100">
  <div class="content-view-upload-container h-100">
    <div class="row no-gutters d-flex align-items-center ms-4 pb-3">
      <div class="col no-gutters">
        <span class="content-view-upload-title-text">Upload an episode</span>
      </div>
      <div class="col-auto no-gutters pe-3 pt-2">
        <div (click)="close()" class="content-view-upload-button-container p-3 d-flex justify-content-center align-items-center">
          <svg class="content-view-upload-button-close-svg" width="55" height="55" viewBox="0 0 55 55" fill="none"
               xmlns="http://www.w3.org/2000/svg">
            <path
              d="M43.5423 14.6895L40.3111 11.4583L27.5007 24.2687L14.6902 11.4583L11.459 14.6895L24.2694 27.4999L11.459 40.3103L14.6902 43.5416L27.5007 30.7312L40.3111 43.5416L43.5423 40.3103L30.7319 27.4999L43.5423 14.6895Z"
              fill="#79786C" />
          </svg>
        </div>
      </div>
    </div>
    <!-- Title Text Box -->
    <div class="row no-gutters px-4">
      <div class="col no-gutters">
        <div (click)="titleTextBox.focus()" class="text-box-container px-3 d-flex align-items-center">
          <input
            type="text"
            id="title"
            class="text-box w-100"
            [(ngModel)]="formData.title"
            placeholder="Title"
            #titleTextBox
          />
        </div>
      </div>
    </div>
    <!-- Description Text Area -->
    <div class="row no-gutters px-4 pt-4">
      <div class="col no-gutters">
        <div (click)="descriptionTextBox.focus()" class="text-area-container px-3 d-flex align-items-center">
          <textarea
            id="description"
            class="text-area w-100 py-3"
            placeholder="Description"
            rows="4"
            cols="40"
            [(ngModel)]="formData.description"
            #descriptionTextBox>
          </textarea>
        </div>
      </div>
    </div>
    <!-- Audio File Selection -->
    <div class="row no-gutters px-4 pt-4">
      <div class="col no-gutters mb-3">
        <div (click)="fileInputAudio.click()" class="file-upload-container me-4">
          <input
            type="file"
            #fileInputAudio
            style="display: none"
            accept=".mp4,.mp3,.m4a"
            (change)="onAudioFileSelected($event)" />
          <div class="row h-100 no-gutters flex-nowrap d-flex justify-content-between align-items-center">
            <div class="col no-gutters ms-4">
              <span class="content-view-upload-label">{{ audioFileLabel }}</span>
            </div>
            <div class="col-auto no-gutters">
              <div class="file-upload-icon-container">
                <svg class="file-upload-icon-svg" width="52" height="52" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M15.166 17.3333V34.6667C15.166 37.5398 16.3074 40.2953 18.339 42.327C20.3707 44.3586 23.1262 45.5 25.9993 45.5C28.8725 45.5 31.628 44.3586 33.6597 42.327C35.6913 40.2953 36.8327 37.5398 36.8327 34.6667V14.0833C36.8327 12.0721 36.0337 10.1433 34.6116 8.72111C33.1894 7.29896 31.2606 6.5 29.2493 6.5C27.2381 6.5 25.3093 7.29896 23.8871 8.72111C22.465 10.1433 21.666 12.0721 21.666 14.0833V32.5C21.666 33.6493 22.1226 34.7515 22.9352 35.5641C23.7479 36.3768 24.8501 36.8333 25.9993 36.8333C27.1486 36.8333 28.2508 36.3768 29.0635 35.5641C29.8761 34.7515 30.3327 33.6493 30.3327 32.5V17.3333"
                    stroke="#BEBAAA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- Transcript File Selection -->
      <div class="col no-gutters mb-3">
        <div (click)="fileInputTranscript.click()" class="file-upload-container">
          <input
            type="file"
            #fileInputTranscript
            style="display: none"
            accept=".json"
            (change)="onTranscriptFileSelected($event)" />
          <div class="row h-100 no-gutters flex-nowrap d-flex justify-content-between align-items-center">
            <div class="col no-gutters ms-4">
              <span class="content-view-upload-label">{{ transcriptFileLabel }}</span>
            </div>
            <div class="col-auto no-gutters">
              <div class="file-upload-icon-container">
                <svg class="file-upload-icon-svg" width="52" height="52" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M15.166 17.3333V34.6667C15.166 37.5398 16.3074 40.2953 18.339 42.327C20.3707 44.3586 23.1262 45.5 25.9993 45.5C28.8725 45.5 31.628 44.3586 33.6597 42.327C35.6913 40.2953 36.8327 37.5398 36.8327 34.6667V14.0833C36.8327 12.0721 36.0337 10.1433 34.6116 8.72111C33.1894 7.29896 31.2606 6.5 29.2493 6.5C27.2381 6.5 25.3093 7.29896 23.8871 8.72111C22.465 10.1433 21.666 12.0721 21.666 14.0833V32.5C21.666 33.6493 22.1226 34.7515 22.9352 35.5641C23.7479 36.3768 24.8501 36.8333 25.9993 36.8333C27.1486 36.8333 28.2508 36.3768 29.0635 35.5641C29.8761 34.7515 30.3327 33.6493 30.3327 32.5V17.3333"
                    stroke="#BEBAAA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Upload Progress -->
    <div class="row no-gutters pt-3 d-flex justify-content-end align-items-center">
      @if (this.uploading) {
        <div class="col-auto no-gutters me-1">
          <span class="content-view-upload-progress-text">Uploading {{this.uploadProgress + '%'}}</span>
        </div>
        <div class="col-auto no-gutters me-4">
          <div class="content-view-upload-progress-animation">
            <svg width="60" height="60" viewBox="0 0 50 50">
              <circle cx="25" cy="25" r="20" fill="none" stroke="#6A675B" stroke-width="4"></circle>
              <circle cx="25" cy="25" r="20" fill="none" stroke="#EBE8DC" stroke-width="4" stroke-linecap="square" stroke-dasharray="125.6" [attr.stroke-dashoffset]="this.uploadProgressPercent">
              </circle>
            </svg>
          </div>
        </div>
      }
      <div class="col-auto no-gutters">
        <div (click)="upload()" class="content-view-upload-button px-3 py-2 me-4">
          <div class="row no-gutters d-flex align-items-center">
            <div class="col no-gutters ps-3 pe-3">
              Upload
            </div>
            <div class="col no-gutters">
              <svg class="content-view-upload-button-svg" width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M29.2616 42.5623V20.8822L22.3452 27.7985L18.621 23.9413L31.9217 10.6406L45.2224 23.9413L41.4982 27.7985L34.5819 20.8822V42.5623H29.2616ZM10.6406 53.2028V39.9021H15.9609V47.8826H47.8826V39.9021H53.2028V53.2028H10.6406Z" fill="#2F7DAA"/>
              </svg>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
