worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    gzip  on;

    server {
        listen       444 ssl;
        server_name  admin.moup.io;
        ssl_certificate      /usr/share/nginx/fullchain1.pem;
        ssl_certificate_key  /usr/share/nginx/privkey1.pem;
        error_page  404              /index.html;
        error_page   500 502 503 504  /index.html;
        location / {
          root   /usr/share/nginx/html;
          index  index.html index.htm;
        }
    }
}
